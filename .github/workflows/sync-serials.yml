name: Sync Serials

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  workflow_dispatch:          # allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch serials from bot API
        run: |
          curl -f --max-time 15 http://89.251.18.227:3000/serials \
            -o docs/serials.json || echo "API offline, skipping sync, will try again later, using existing serials.json"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/serials.json
          git diff --cached --quiet || git commit -m "chore: sync serials from bot API"
          git push